[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "intarsia-print"
version = "0.1.0"
description = "Flat graphic image or text prompt -> multi-level bas-relief STL for resin printing"
requires-python = ">=3.10"
dependencies = ["numpy", "pillow", "scipy", "flask"]

[project.scripts]
intarsia = "intarsia.cli:main"

[tool.setuptools]
packages = ["intarsia", "intarsia.web"]

[tool.setuptools.package-data]
"intarsia.web" = ["static/*"]
