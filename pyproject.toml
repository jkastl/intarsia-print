[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "intarsia-print"
version = "0.1.0"
description = "Flat graphic image or text prompt -> multi-level bas-relief STL for resin printing"
requires-python = ">=3.10"
dependencies = ["numpy", "pillow", "scipy"]

[project.scripts]
intarsia = "intarsia.cli:main"

[tool.setuptools]
packages = ["intarsia"]
